name: imovel-pratico-production

services:
  postgres-prod:
    image: postgres:17-alpine
    container_name: imovel-pratico-postgres-prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - imovel-pratico-production

  redis-prod:
    image: redis:8-alpine
    container_name: imovel-pratico-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    networks:
      - imovel-pratico-production

  api-gateway-prod:
    container_name: imovel-pratico-api-gateway-prod
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      args:
        APP_NAME: "@imovel-pratico/api-gateway"
    env_file:
      - .env.production
    environment:
      PORT: 3333
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      NODE_ENV: production
      TRUST_PROXY: "true"
    depends_on:
      - postgres-prod
      - redis-prod
    ports:
      - "127.0.0.1:3333:3333"
    networks:
      - imovel-pratico-production

  web-home-prod:
    container_name: imovel-pratico-web-home-prod
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile.next
      args:
        APP_NAME: "@imovel-pratico/web-home"
        APP_PORT: "3000"
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    env_file:
      - .env.production
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - api-gateway-prod
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - imovel-pratico-production

  web-client-prod:
    container_name: imovel-pratico-web-client-prod
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile.next
      args:
        APP_NAME: "@imovel-pratico/web-client"
        APP_PORT: "3001"
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    env_file:
      - .env.production
    environment:
      PORT: 3001
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - api-gateway-prod
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - imovel-pratico-production

  web-admin-prod:
    container_name: imovel-pratico-web-admin-prod
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile.next
      args:
        APP_NAME: "@imovel-pratico/web-admin"
        APP_PORT: "3002"
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    env_file:
      - .env.production
    environment:
      PORT: 3002
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - api-gateway-prod
    ports:
      - "127.0.0.1:3002:3002"
    networks:
      - imovel-pratico-production

  worker-registro-prod:
    profiles: ["workers"]
    container_name: imovel-pratico-worker-registro-prod
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      args:
        APP_NAME: "@imovel-pratico/worker-registro"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PLAYWRIGHT_HEADLESS: "true"
      PLAYWRIGHT_SLOW_MO: "0"
    depends_on:
      - postgres-prod
      - redis-prod
    networks:
      - imovel-pratico-production

  worker-cnd-prod:
    profiles: ["workers"]
    container_name: imovel-pratico-worker-cnd-prod
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      args:
        APP_NAME: "@imovel-pratico/worker-cnd"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PLAYWRIGHT_HEADLESS: "true"
      PLAYWRIGHT_SLOW_MO: "0"
    depends_on:
      - postgres-prod
      - redis-prod
    networks:
      - imovel-pratico-production

volumes:
  postgres_prod_data:
  redis_prod_data:

networks:
  imovel-pratico-production:
    driver: bridge
